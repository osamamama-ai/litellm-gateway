<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architecture - LiteLLM Gateway</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1e1e2e;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            width: 100%;
        }
        .title {
            text-align: center;
            color: #667eea;
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 50px;
        }
        svg {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }
        .diagram-section {
            margin-bottom: 50px;
        }
        .section-title {
            color: #667eea;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
        }
        .legend {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 40px;
            padding: 30px;
            background: #2a2a3e;
            border-radius: 12px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            flex-shrink: 0;
        }
        .legend-text {
            color: #e0e0e0;
            font-size: 14px;
        }
        @media (max-width: 768px) {
            .title {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">🏗️ 5-Tier Model Routing Architecture</div>

        <div class="diagram-section">
            <svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
                <!-- Title -->
                <text x="500" y="30" font-size="24" font-weight="bold" fill="#667eea" text-anchor="middle">
                    Intelligent Request Routing
                </text>

                <!-- User/App -->
                <rect x="400" y="80" width="200" height="60" rx="8" fill="#667eea" stroke="#00ff00" stroke-width="2"/>
                <text x="500" y="115" font-size="14" font-weight="bold" fill="white" text-anchor="middle">
                    📱 Your App / Claude Code
                </text>

                <!-- Arrow down -->
                <path d="M 500 140 L 500 180" stroke="#667eea" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

                <!-- LiteLLM Gateway -->
                <rect x="350" y="180" width="300" height="60" rx="8" fill="#764ba2" stroke="#667eea" stroke-width="2"/>
                <text x="500" y="215" font-size="14" font-weight="bold" fill="white" text-anchor="middle">
                    🚀 LiteLLM Gateway (Local Proxy)
                </text>

                <!-- Tier boxes -->
                <g>
                    <!-- Tier 1 -->
                    <rect x="50" y="300" width="140" height="100" rx="8" fill="#2a2a3e" stroke="#00ff00" stroke-width="2"/>
                    <text x="120" y="320" font-size="12" font-weight="bold" fill="#00ff00" text-anchor="middle">1️⃣ DeepSeek Flash</text>
                    <text x="120" y="340" font-size="11" fill="#999" text-anchor="middle">Simple Tasks</text>
                    <text x="120" y="360" font-size="11" fill="#999" text-anchor="middle">$0.014/1M</text>
                    <text x="120" y="380" font-size="10" fill="#666" text-anchor="middle">tokens</text>

                    <!-- Tier 2 -->
                    <rect x="220" y="300" width="140" height="100" rx="8" fill="#2a2a3e" stroke="#00d4ff" stroke-width="2"/>
                    <text x="290" y="320" font-size="12" font-weight="bold" fill="#00d4ff" text-anchor="middle">2️⃣ Kimi K2.7</text>
                    <text x="290" y="340" font-size="11" fill="#999" text-anchor="middle">Code Generation</text>
                    <text x="290" y="360" font-size="11" fill="#999" text-anchor="middle">$0.050/1M</text>
                    <text x="290" y="380" font-size="10" fill="#666" text-anchor="middle">tokens</text>

                    <!-- Tier 3 -->
                    <rect x="390" y="300" width="140" height="100" rx="8" fill="#2a2a3e" stroke="#667eea" stroke-width="2"/>
                    <text x="460" y="320" font-size="12" font-weight="bold" fill="#667eea" text-anchor="middle">3️⃣ Claude Haiku</text>
                    <text x="460" y="340" font-size="11" fill="#999" text-anchor="middle">Quality + Speed</text>
                    <text x="460" y="360" font-size="11" fill="#999" text-anchor="middle">$0.080/1M</text>
                    <text x="460" y="380" font-size="10" fill="#666" text-anchor="middle">tokens</text>

                    <!-- Tier 4 -->
                    <rect x="560" y="300" width="140" height="100" rx="8" fill="#2a2a3e" stroke="#764ba2" stroke-width="2"/>
                    <text x="630" y="320" font-size="12" font-weight="bold" fill="#764ba2" text-anchor="middle">4️⃣ Claude Sonnet</text>
                    <text x="630" y="340" font-size="11" fill="#999" text-anchor="middle">Complex Reasoning</text>
                    <text x="630" y="360" font-size="11" fill="#999" text-anchor="middle">$3.00/1M</text>
                    <text x="630" y="380" font-size="10" fill="#666" text-anchor="middle">tokens</text>

                    <!-- Tier 5 -->
                    <rect x="730" y="300" width="140" height="100" rx="8" fill="#2a2a3e" stroke="#ff9800" stroke-width="2"/>
                    <text x="800" y="320" font-size="12" font-weight="bold" fill="#ff9800" text-anchor="middle">5️⃣ DeepSeek Pro</text>
                    <text x="800" y="340" font-size="11" fill="#999" text-anchor="middle">Fallback Quality</text>
                    <text x="800" y="360" font-size="11" fill="#999" text-anchor="middle">$0.270/1M</text>
                    <text x="800" y="380" font-size="10" fill="#666" text-anchor="middle">tokens</text>
                </g>

                <!-- Arrows from gateway to tiers -->
                <path d="M 420 240 L 120 300" stroke="#667eea" stroke-width="1.5" fill="none" stroke-dasharray="5,5"/>
                <path d="M 450 240 L 290 300" stroke="#667eea" stroke-width="1.5" fill="none" stroke-dasharray="5,5"/>
                <path d="M 500 240 L 460 300" stroke="#667eea" stroke-width="1.5" fill="none" stroke-dasharray="5,5"/>
                <path d="M 550 240 L 630 300" stroke="#667eea" stroke-width="1.5" fill="none" stroke-dasharray="5,5"/>
                <path d="M 580 240 L 800 300" stroke="#667eea" stroke-width="1.5" fill="none" stroke-dasharray="5,5"/>

                <!-- Features box -->
                <rect x="50" y="450" width="820" height="80" rx="8" fill="#2a2a3e" stroke="#667eea" stroke-width="2"/>
                <text x="460" y="475" font-size="13" font-weight="bold" fill="#667eea" text-anchor="middle">✨ Smart Routing Features</text>
                <text x="460" y="497" font-size="11" fill="#999" text-anchor="middle">
                    ✓ Automatic failover chain  •  ✓ Real-time cost tracking  •  ✓ Complexity detection  •  ✓ Quality vs Cost optimization
                </text>
                <text x="460" y="517" font-size="11" fill="#999" text-anchor="middle">
                    ✓ Per-request model selection  •  ✓ Local desktop control panel  •  ✓ Works with Claude Code
                </text>

                <!-- Arrow markers -->
                <defs>
                    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
                        <polygon points="0 0, 10 5, 0 10" fill="#667eea"/>
                    </marker>
                </defs>
            </svg>

            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color" style="background: #00ff00;"></div>
                    <div class="legend-text">Cheapest (Simple tasks)</div>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #00d4ff;"></div>
                    <div class="legend-text">Fast Code Generation</div>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #667eea;"></div>
                    <div class="legend-text">Balanced Quality/Speed</div>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #764ba2;"></div>
                    <div class="legend-text">High Quality Reasoning</div>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #ff9800;"></div>
                    <div class="legend-text">Premium Fallback</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
