<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#brandGradient)" opacity="0.1"/>

  <!-- Rocket body -->
  <g transform="translate(100, 100)">
    <!-- Rocket flame -->
    <path d="M -8 25 L -5 40 L 0 35 L 5 40 L 8 25 Z" fill="#ff6b00" opacity="0.8"/>
    <path d="M -6 25 L -3 35 L 0 32 L 3 35 L 6 25 Z" fill="#ffaa00" opacity="0.6"/>

    <!-- Rocket body -->
    <rect x="-10" y="-40" width="20" height="65" rx="5" fill="url(#brandGradient)"/>

    <!-- Rocket window -->
    <circle cx="0" cy="-25" r="6" fill="#00ff00"/>

    <!-- Left fin -->
    <path d="M -10 -5 L -20 10 L -10 5 Z" fill="url(#brandGradient)" opacity="0.9"/>

    <!-- Right fin -->
    <path d="M 10 -5 L 20 10 L 10 5 Z" fill="url(#brandGradient)" opacity="0.9"/>

    <!-- Nose cone -->
    <path d="M -8 -40 L 0 -50 L 8 -40 Z" fill="url(#brandGradient)"/>

    <!-- Accent glow -->
    <circle cx="0" cy="-25" r="8" fill="none" stroke="#00ff00" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Text below -->
  <text x="100" y="175" font-size="20" font-weight="bold" text-anchor="middle" fill="#667eea" font-family="Helvetica, Arial, sans-serif">
    LiteLLM
  </text>
</svg>
